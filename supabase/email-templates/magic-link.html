<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · đề rõ</title>
</head>
<body style="margin:0;padding:0;background:#f7f8f7;font-family:'Be Vietnam Pro',Arial,sans-serif;color:#14181c;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8f7;padding:40px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:8px;padding:36px 32px;">
      <tr><td>
        <img src="https://dero.id.vn/brand/logo-de-ro.png" width="97" height="36" alt="đề rõ" style="display:block;width:97px;height:auto;border:0;margin:0 0 24px;">
        <h1 style="margin:0 0 12px;font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-0.02em;">Đăng nhập vào đề rõ</h1>
        <p style="margin:0 0 28px;font-size:15px;line-height:1.7;color:#3d454d;">
          Bấm nút bên dưới để đăng nhập. Liên kết chỉ dùng được một lần.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:999px;background:#b4532a;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 26px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Đăng nhập</a>
        </td></tr></table>
        <p style="margin:28px 0 0;font-size:13px;line-height:1.7;color:#6b757e;">
          Nếu nút không hoạt động, dán liên kết này vào trình duyệt:<br>
          <span style="word-break:break-all;color:#3d454d;">{{ .ConfirmationURL }}</span>
        </p>
        <hr style="border:0;border-top:1px solid #e3e7e6;margin:28px 0 20px;">
        <p style="margin:0;font-size:12px;line-height:1.7;color:#98a2aa;">
          Nếu bạn không yêu cầu đăng nhập, bỏ qua email này.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
